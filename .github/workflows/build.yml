name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            mailbroom-app/package-lock.json
            mailbroom-app/electron/package-lock.json

      - name: Create credentials.json from Secret
        shell: bash
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > mailbroom-app/credentials.json

      - name: Install dependencies
        run: |
          cd mailbroom-app
          npm install
          cd electron
          npm install

      - name: Build Web App & Sync
        run: |
          cd mailbroom-app
          npm run electron:sync

      - name: Compile Electron
        run: |
          cd mailbroom-app/electron
          npm run build

      - name: Package with Electron-Builder
        run: |
          cd mailbroom-app/electron
          npx electron-builder ${{ matrix.platform }} -p never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailbroom-${{ matrix.os }}
          path: |
            mailbroom-app/electron/out/*.exe
            mailbroom-app/electron/out/*.dmg
            mailbroom-app/electron/out/*.zip
            mailbroom-app/electron/out/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

